<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trattoria — Porosia u dërgua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f1;--card:#fafbf8;--ink:#111;--mute:#6f716a;--line:#e3e5dc;
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Montserrat",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html,body{height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;padding:16px}

.box{background:var(--card);width:min(560px,100%);padding:clamp(20px,6vh,56px) 40px;text-align:center}
.check{width:clamp(44px,9vh,72px);height:clamp(44px,9vh,72px);margin:0 auto clamp(12px,3vh,28px);display:block}
.check circle{fill:none;stroke:var(--ink);stroke-width:1.5}
.check path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:square}
h1{font-family:var(--serif);font-size:clamp(28px,6vh,48px);font-weight:500;line-height:1.1}
p{color:var(--mute);margin-top:clamp(8px,1.5vh,14px);font-size:14px;line-height:1.5}

.meta{display:flex;justify-content:space-between;margin-top:clamp(16px,4vh,34px);padding:clamp(12px,2.5vh,20px) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta div{text-align:left}
.meta div:last-child{text-align:right}
.meta small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.meta b{font-family:var(--serif);font-size:clamp(20px,3.5vh,26px);font-weight:500}

a.btn{display:block;margin-top:clamp(16px,3.5vh,30px);background:var(--ink);color:#fff;text-decoration:none;padding:clamp(14px,2.5vh,20px);font-size:12px;letter-spacing:.22em;text-transform:uppercase}
a.btn:active{background:#333}

/* Ekran i ulet (telefon horizontal): dy kolona, pa scroll */
@media (max-height:600px) and (orientation:landscape){
  body{padding:10px 16px}
  .box{width:min(860px,100%);display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;padding:20px 32px;text-align:left}
  .check{margin:0 0 10px}
  h1{font-size:clamp(26px,8vh,34px)}
  p{font-size:13px;margin-top:6px}
  .meta{flex-direction:column;gap:0;margin-top:0;padding:0;border-top:1px solid var(--line);border-bottom:0}
  .meta div,.meta div:last-child{text-align:left;display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .meta small{margin:0}
  .meta b{font-size:22px}
  a.btn{margin-top:14px;padding:14px}
}
</style>
</head>
<body>

<div class="box">
  <div class="left">
    <svg class="check" viewBox="0 0 72 72"><circle cx="36" cy="36" r="34"/><path d="M22 37l10 10 18-21"/></svg>
    <h1>Porosia u dërgua</h1>
    <p>Faleminderit! Porosia juaj po përgatitet.</p>
  </div>
  <div class="right">
    <div class="meta">
      <div><small>Nr. i porosisë</small><b id="no">—</b></div>
      <div><small>Produkte</small><b id="it">—</b></div>
      <div><small>Total</small><b id="tt">—</b></div>
    </div>
    <a class="btn" href="index.html">Porosi e re</a>
  </div>
</div>

<script>
try{
  const o = JSON.parse(localStorage.getItem("lastOrder"));
  if(o){
    document.getElementById("no").textContent = "#" + o.no;
    document.getElementById("it").textContent = o.items;
    document.getElementById("tt").textContent = o.total.toLocaleString("en-US") + " L";
  }
}catch(e){}
</script>
</body>
</html>
