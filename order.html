<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trattoria — Përmbledhja e porosisë</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f1;--card:#fafbf8;--ink:#111;--mute:#6f716a;--line:#e3e5dc;--ph:#e4e7dc;
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Montserrat",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:var(--sans);cursor:pointer;color:var(--ink);background:none;border:1px solid var(--ink);touch-action:manipulation}
a{color:inherit}

.wrap{display:grid;grid-template-columns:1fr 380px;gap:28px;max-width:1300px;margin:32px auto 70px;padding:0 40px;align-items:start}
.wrap.one{grid-template-columns:1fr;max-width:820px}
.list{background:var(--card)}
.phead{display:flex;justify-content:space-between;align-items:center;padding:26px 28px;border-bottom:1px solid var(--line)}
.phead h2{font-family:var(--serif);font-size:34px;font-weight:500}
.link{border:0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-left:22px;padding:10px 0;text-decoration:none}
.item{display:flex;align-items:center;gap:20px;padding:16px 28px;border-bottom:1px solid var(--line)}
.item img{width:84px;height:84px;object-fit:cover;background:var(--ph);flex:none}
.item .nm{flex:1;font-family:var(--serif);font-size:24px;font-weight:500}
.item .nm small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.row{display:flex;align-items:center;border:1px solid var(--line);width:150px}
.row button{border:0;width:52px;height:46px;font-size:20px}
.row span{flex:1;text-align:center;font-size:15px}
.item .tot{width:100px;text-align:right;font-family:var(--serif);font-size:24px;font-weight:500}
.side{background:var(--card);padding:28px;position:sticky;top:24px}
.side h3{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:500;margin-bottom:14px}
.line{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);padding:6px 0}
.sum{display:flex;justify-content:space-between;font-family:var(--serif);font-size:36px;font-weight:500;margin:18px 0 22px;padding-top:18px;border-top:1px solid var(--line)}
.place{width:100%;background:var(--ink);color:#fff;padding:20px;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.msg{padding:70px 28px;text-align:center;color:var(--mute);font-family:var(--serif);font-size:26px}

@media(max-width:900px){.wrap{grid-template-columns:1fr;padding:0 16px}.side{position:static}}
@media(max-width:560px){.item{flex-wrap:wrap;padding:16px}.item .nm{flex-basis:calc(100% - 104px)}.phead{padding:20px 16px}}
</style>
</head>
<body>
<main id="app"></main>

<script>
const load = () => { try { return JSON.parse(localStorage.getItem("order")) || {} } catch(e){ return {} } };
const save = o => { try { localStorage.setItem("order", JSON.stringify(o)) } catch(e){} };
let cart = load();

const fmt = n => n.toLocaleString("en-US") + " L";
const count = () => Object.values(cart).reduce((a,x)=>a+x.q,0);
const total = () => Object.values(cart).reduce((a,x)=>a+x.p*x.q,0);

function render(){
  const ids = Object.keys(cart), has = ids.length > 0;
  let h = `<section class="wrap ${has?"":"one"}"><div class="list"><div class="phead"><h2>Porosia juaj</h2><div>
    <a class="link" href="index.html">← Menuja</a>
    ${has?`<button class="link" id="clr">Fshi të gjitha</button>`:""}</div></div>`;

  if(!has){
    h += `<div class="msg">Porosia është bosh.</div>`;
  } else {
    h += ids.map(i=>{
      const x = cart[i];
      return `<div class="item"><img src="${x.i}" alt="${x.n}" onerror="this.style.display='none'">
        <div class="nm">${x.n}<small>${fmt(x.p)}</small></div>
        <div class="row"><button data-m="${i}">−</button><span>${x.q}</span><button data-p="${i}">+</button></div>
        <div class="tot">${fmt(x.p*x.q)}</div></div>`;
    }).join("");
  }
  h += `</div>`;
  if(has){
    h += `<aside class="side"><h3>Përmbledhje</h3>
      <div class="line"><span>Produkte</span><span>${count()}</span></div>
      <div class="sum"><span>Total</span><span>${fmt(total())}</span></div>
      <button class="place" id="pl">Dërgo porosinë</button></aside>`;
  }
  const app = document.getElementById("app");
  app.innerHTML = h + "</section>";

  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const i=b.dataset.m;cart[i].q--;if(cart[i].q<=0)delete cart[i];save(cart);render()});
  app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{cart[b.dataset.p].q++;save(cart);render()});
  const c = document.getElementById("clr"); if(c) c.onclick=()=>{cart={};save(cart);render()};
  const pl = document.getElementById("pl");
  if(pl) pl.onclick=()=>{
    const no = String(Math.floor(1000 + Math.random()*9000));
    try{
      localStorage.setItem("lastOrder", JSON.stringify({no, items:count(), total:total(), at:Date.now()}));
      localStorage.removeItem("order");
    }catch(e){}
    location.href = "sent.html";
  };
}
render();
</script>
</body>
</html>
